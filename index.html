<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Roz — Daily Kit</title>
  <meta name="description" content="Tasks, spends, udhaar, habits, water, notes and everyday calculators in one small app. Works offline. No account, no server — your data stays on your phone.">
  <meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Roz">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint so there is no light/dark flash.
    try {
      var t = (JSON.parse(localStorage.getItem('roz:data:v1') || '{}').settings || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Roz needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
